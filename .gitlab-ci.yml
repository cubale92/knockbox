# Builds and tests both Windows VST3s (Knockbox + Knockbox Track) on GitLab's free Windows machines.
# Every push runs this. The finished plugins are under the job's "Artifacts" (Download button).

stages:
  - build

windows-vst3:
  stage: build
  tags:
    - saas-windows-medium-amd64
  timeout: 2h
  variables:
    GIT_DEPTH: "20"
  script:
    # Everything is in one PowerShell script (shared with the GitHub build), because GitLab runs
    # each line here separately and multi-line PowerShell does not survive that.
    - powershell -NoProfile -ExecutionPolicy Bypass -File ci\build-windows.ps1
    - if ($LASTEXITCODE -ne 0) { exit 1 }
  artifacts:
    name: "Knockbox-Windows-VST3"
    when: always
    expire_in: 1 year
    paths:
      - dist/
      - pluginval-logs/
